name: ci

# Los nombres de los jobs (test, lint, vuln, secrets, build) son los checks
# obligatorios del ruleset de main: no se renombran sin cambiar el ruleset.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para el comentario de cobertura en el PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tests
        run: >-
          go run gotest.tools/gotestsum@v1.13.0
          --format github-actions
          --junitfile "$RUNNER_TEMP/junit.xml"
          -- -coverprofile="$RUNNER_TEMP/coverage.out" ./...
      # Tabla en el resumen, anotaciones en los tests que fallan y, en PRs, el
      # comentario de cobertura. Corre aunque fallen los tests: el paso
      # anterior ya hace fallar el job.
      - name: Informe de tests y cobertura
        if: ${{ !cancelled() }}
        run: |
          go run ./scripts/ci/test-report \
            --junit "$RUNNER_TEMP/junit.xml" \
            --coverprofile "$RUNNER_TEMP/coverage.out" \
            ${PR:+--pr "$PR"}
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-report
          path: |
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/coverage.out
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # En main, el JSON para el badge de vulnerabilidades. Con -format json
      # govulncheck no falla aunque encuentre algo: falla el paso siguiente.
      - name: govulncheck (JSON para el badge)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... > "$RUNNER_TEMP/govulncheck.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: govulncheck
          path: ${{ runner.temp }}/govulncheck.json
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # KPIs de main (cobertura, tests y vulnerabilidades) como JSON de shields.io
  # en la rama huérfana badges, que leen el README y el comentario de
  # cobertura de los PR (ADR-0002). Solo en push a main: en un PR no corre ni
  # escribe nada. Corre aunque fallen test o vuln, para que el badge lo cuente.
  badges:
    needs: [test, vuln]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # Para reescribir la rama badges.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: govulncheck
          path: ${{ runner.temp }}/in
      - name: Generar los JSON
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          go run ./scripts/ci/badges \
            --junit "$RUNNER_TEMP/in/junit.xml" \
            --coverprofile "$RUNNER_TEMP/in/coverage.out" \
            --govulncheck "$RUNNER_TEMP/in/govulncheck.json" \
            --out "$RUNNER_TEMP/badges"
      # Un único commit sin padres que reemplaza la rama entera: no acumula
      # historial.
      - name: Publicar en la rama badges
        working-directory: ${{ runner.temp }}/badges
        run: |
          git init -q -b badges
          git add ./*.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "KPIs de main en $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GH_TOKEN: ${{ github.token }}

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 de gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, del
      # checksums.txt de la release oficial.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --config .gitleaks.toml --verbose .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: build --snapshot --clean

  install-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/test-install.sh

  repo-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/test-repo-settings.sh

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/test-release-guard.sh

  confirm-tag-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/test-confirm-tag-push.sh
