version: 2

builds:
  - main: ./cmd/gadis
    binary: gadis
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/DavidJuanes/gadis-cli/internal/cli.Version={{.Version}}

archives:
  - name_template: "gadis_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# Las notas las genera GitHub a partir de los PR, agrupados por etiqueta según
# .github/release.yml.
changelog:
  use: github-native

# Con las immutable releases activadas, una release publicada ya no admite archivos nuevos.
# GoReleaser la crea como borrador, sube todo y la publica al final (no hay que tocar `draft`).
# El preflight comprueba antes de compilar que el token puede publicar y que el tag no tiene ya
# una release inmutable; con fail_on_error para en vez de solo avisar.
release:
  preflight:
    fail_on_error: true

# Un SBOM (SPDX JSON, con syft) por archivo, adjunto a la release como <archivo>.sbom.json.
sboms:
  - artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.json"]
    args: ["$artifact", "--output", "spdx-json=$document"]
