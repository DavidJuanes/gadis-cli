version: 2

builds:
  - main: ./cmd/gadis
    binary: gadis
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/DavidJuanes/gadis-cli/internal/cli.Version={{.Version}}

archives:
  - name_template: "gadis_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github

# Un SBOM (SPDX JSON, con syft) por archivo, adjunto a la release como <archivo>.sbom.json.
sboms:
  - artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.json"]
    args: ["$artifact", "--output", "spdx-json=$document"]
